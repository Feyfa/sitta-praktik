<!-- ===== MODAL LOGIN: LUPA PASSWORD DAN DAFTAR ===== -->
<div class="modal" id="forgot-modal" role="dialog" aria-modal="true" aria-labelledby="forgot-title" hidden>
    <section class="modal-panel">
        <button class="modal-close" type="button" data-close-modal aria-label="Tutup">×</button>
        <p class="eyebrow">Akun mahasiswa</p>
        <h2 id="forgot-title">Lupa password?</h2>
        <p>Untuk bantuan mengatur ulang password, silakan hubungi pengelola akun Anda.</p>
        <button class="button button-primary" type="button" data-close-modal>Tutup</button>
    </section>
</div>

<div class="modal" id="register-modal" role="dialog" aria-modal="true" aria-labelledby="register-title" hidden>
    <section class="modal-panel">
        <button class="modal-close" type="button" data-close-modal aria-label="Tutup">×</button>
        <p class="eyebrow">Akun mahasiswa</p>
        <h2 id="register-title">Daftar akun</h2>
        <p>Untuk membuat akun, silakan hubungi pengelola akun Anda.</p>
        <button class="button button-primary" type="button" data-close-modal>Tutup</button>
    </section>
</div>
